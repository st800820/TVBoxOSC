<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>观影听涛 · 手机遥控台</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#242c38; --fg:#e6edf3;
    --dim:#8b949e; --pri:#2f81f7; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;overflow-x:hidden}
  body{
    margin:0;padding:16px 14px 30px;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.5px;flex-shrink:0}
  .badge{
    font-size:11px;padding:2px 8px;border-radius:20px;background:#1f2937;
    color:var(--dim);border:1px solid var(--line);white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis
  }
  .badge.on{color:var(--ok);border-color:#22432c}
  section{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:12px;min-width:0;max-width:100%
  }
  section h2{
    font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:500;
    display:flex;justify-content:space-between;align-items:center
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv{background:#0f141b;border-radius:9px;padding:9px 11px;min-width:0;overflow:hidden}
  .kv .k{font-size:11px;color:var(--dim);margin-bottom:3px}
  .kv .v{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row{display:flex;gap:8px;margin-bottom:10px;min-width:0}
  .row:last-child{margin-bottom:0}
  input{
    flex:1 1 0;width:0;min-width:0;background:#0f141b;border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:10px 12px;font-size:14px;outline:none
  }
  input:focus{border-color:var(--pri)}
  input::placeholder{color:#4b5563}
  button{
    border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:500;
    background:var(--pri);color:#fff;white-space:nowrap
  }
  button:active{opacity:.75}
  button.ghost{background:#21262d;color:var(--fg);border:1px solid var(--line)}
  button.sm{padding:8px 12px;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:8px 14px;border-radius:8px;background:#0f141b;border:1px solid var(--line);
    color:var(--dim);font-size:13px
  }
  .chip.sel{background:#12233d;border-color:var(--pri);color:#79b8ff}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
  .full{width:100%}
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#1f6feb;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;
    opacity:0;transition:.22s;pointer-events:none;z-index:9
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#a4262c}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>观影听涛</h1>
    <span class="badge" id="devBadge">连接中…</span>
    <span class="badge" id="verBadge"></span>
  </header>

  <section>
    <h2>当前状态 <button class="ghost sm" onclick="loadStatus()">刷新</button></h2>
    <div class="grid">
      <div class="kv"><div class="k">点播源</div><div class="v" id="sApi">-</div></div>
      <div class="kv"><div class="k">直播源</div><div class="v" id="sLive">-</div></div>
      <div class="kv"><div class="k">画面比例</div><div class="v" id="sScale">-</div></div>
      <div class="kv"><div class="k">直播播放器</div><div class="v" id="sPlayer">-</div></div>
    </div>
    <div class="hint">这里显示的是电视/盒子上正在用的配置。下面改完点「重启生效」即可。</div>
  </section>

  <section>
    <h2>点播源</h2>
    <div class="row">
      <input id="inApi" placeholder="接口地址，例如 https://…/config.json" autocomplete="off">
      <button onclick="save('apiUrl','inApi')">保存</button>
    </div>
    <div class="hint">留空不会清空，必须填完整 URL。</div>
  </section>

  <section>
    <h2>直播源</h2>
    <div class="row">
      <input id="inLive" placeholder="m3u / txt 地址" autocomplete="off">
      <button onclick="save('liveUrl','inLive')">保存</button>
    </div>
  </section>

  <section>
    <h2>画面比例</h2>
    <div class="chips" id="scaleChips">
      <div class="chip" data-v="0">默认</div>
      <div class="chip" data-v="5">裁剪</div>
      <div class="chip" data-v="1">16:9</div>
      <div class="chip" data-v="2">4:3</div>
      <div class="chip" data-v="4">原始</div>
    </div>
    <div class="hint">「默认」按原始比例，4:3 老源会左右留黑边；「裁剪」铺满不变形（推荐）。</div>
  </section>

  <section>
    <h2>直播播放器</h2>
    <div class="chips" id="playerChips">
      <div class="chip" data-v="2">EXO（推荐）</div>
      <div class="chip" data-v="1">IJK</div>
    </div>
    <div class="hint">改完不用急，下次起播就会按新设置来。</div>
  </section>

  <section>
    <h2>搜片 / 推片到电视</h2>
    <div class="row">
      <input id="inWord" placeholder="片名关键词" autocomplete="off">
      <button onclick="doAction('search','word','inWord')">搜索</button>
    </div>
    <div class="row">
      <input id="inPush" placeholder="视频播放地址（m3u8 / mp4）" autocomplete="off">
      <button class="ghost" onclick="doAction('push','url','inPush')">推送</button>
    </div>
    <div class="hint">搜索会直接在电视上跳出结果；推送的地址会在电视上立即开播。</div>
  </section>

  <section>
    <button class="full" onclick="reboot()">重启 App 生效</button>
    <div class="hint">改过接口地址后必须重启才会重新加载。重启大约 5 秒，电视会自己回到首页。</div>
  </section>

</div>
<div id="toast"></div>

<script>
var STATE = {};

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.className = ''; }, 2200);
}

function shortUrl(u) {
  if (!u) return '未设置';
  try { return u.replace(/^https?:\/\//, '').slice(0, 34); } catch (e) { return u; }
}

function loadStatus() {
  fetch('/api/status', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      STATE = d;
      document.getElementById('devBadge').textContent = d.device || '未知';
      document.getElementById('devBadge').className = 'badge on';
      document.getElementById('verBadge').textContent = (d.version || '').replace('1.0.0-', '');
      document.getElementById('sApi').textContent = shortUrl(d.apiUrl);
      document.getElementById('sLive').textContent = shortUrl(d.liveUrl);
      document.getElementById('sScale').textContent = d.scale || '-';
      document.getElementById('sPlayer').textContent = d.player || '-';
      document.getElementById('inApi').value = d.apiUrl || '';
      document.getElementById('inLive').value = d.liveUrl || '';
      markChips('scaleChips', String(d.scaleValue));
      markChips('playerChips', String(d.playerValue));
    })
    .catch(function () {
      document.getElementById('devBadge').textContent = '连不上';
      toast('读不到状态，确认手机和电视在同一 WiFi', true);
    });
}

function markChips(id, val) {
  var box = document.getElementById(id);
  for (var i = 0; i < box.children.length; i++) {
    var c = box.children[i];
    c.className = 'chip' + (c.getAttribute('data-v') === val ? ' sel' : '');
  }
}

function save(k, inputId) {
  var v = document.getElementById(inputId).value.trim();
  if (!v) { toast('先填地址', true); return; }
  fetch('/api/set?k=' + encodeURIComponent(k) + '&v=' + encodeURIComponent(v))
    .then(function (r) { return r.text(); })
    .then(function (t) {
      if (t === 'ok') { toast('已保存，点下方「重启 App 生效」'); loadStatus(); }
      else toast('保存被拒绝：' + t, true);
    })
    .catch(function () { toast('保存失败', true); });
}

function setChip(groupId, key, v) {
  fetch('/api/set?k=' + key + '&v=' + v)
    .then(function (r) { return r.text(); })
    .then(function (t) {
      if (t === 'ok') { markChips(groupId, v); toast('已切换'); loadStatus(); }
      else toast('切换失败', true);
    });
}

document.getElementById('scaleChips').addEventListener('click', function (e) {
  if (e.target.classList.contains('chip')) setChip('scaleChips', 'scale', e.target.getAttribute('data-v'));
});
document.getElementById('playerChips').addEventListener('click', function (e) {
  if (e.target.classList.contains('chip')) setChip('playerChips', 'player', e.target.getAttribute('data-v'));
});

function doAction(action, field, inputId) {
  var v = document.getElementById(inputId).value.trim();
  if (!v) { toast('先输入内容', true); return; }
  var body = 'do=' + encodeURIComponent(action) + '&' + field + '=' + encodeURIComponent(v);
  fetch('/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }).then(function () {
    toast(action === 'search' ? '已发到电视，看下电视屏幕' : '已推送');
  }).catch(function () { toast('发送失败', true); });
}

function reboot() {
  if (!confirm('重启 App？电视会短暂黑屏几秒。')) return;
  toast('正在重启…');
  fetch('/api/set?k=reboot&v=1').catch(function () {});
  setTimeout(function () { document.getElementById('devBadge').textContent = '重启中…'; }, 1200);
}

loadStatus();
</script>
</body>
</html>
