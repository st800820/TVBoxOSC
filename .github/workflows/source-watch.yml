name: Source Watch

# 每天巡检一次订阅源健康度；源大面积失效时自动开 issue 提醒
on:
  schedule:
    - cron: '0 0 * * *'        # UTC 00:00 = 北京 08:00
  workflow_dispatch:
    inputs:
      config_url:
        description: '要巡检的配置（默认巡检仓库内 taoying/config.json）'
        required: false
        default: 'taoying/config.json'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 巡检
        id: check
        env:
          CFG: ${{ inputs.config_url || 'taoying/config.json' }}
        run: |
          set +e
          python tools/source-health/check_sources.py --config "$CFG" --json report.json | tee summary.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          exit 0

      - name: 写入 Job 摘要
        if: always()
        run: |
          {
            echo "## 涛影订阅源巡检"
            echo ""
            echo '```'
            cat summary.txt 2>/dev/null || echo "无输出"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 有异常时开 issue
        if: steps.check.outputs.exit_code != '0'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '自动巡检发现订阅源异常，请查看并决定是否换源。\n\n```\n' +
              (fs.existsSync('summary.txt') ? fs.readFileSync('summary.txt', 'utf8') : '无输出') + '\n```';
            const title = '[巡检] 订阅源异常 ' + new Date().toISOString().slice(0, 10);
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            // 已有未关闭的巡检 issue 就不再刷新的，避免每天一堆重复
            if (open.data.some(i => i.title.startsWith('[巡检] 订阅源异常'))) {
              console.log('已有未关闭的巡检 issue，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body
            });
            console.log('已创建 issue: ' + title);

      - name: 上传巡检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-report
          path: |
            summary.txt
            report.json
          retention-days: 30
