name: TaoYing Build

# 触发方式：
#   1) 手动：Actions → TaoYing Build → Run workflow
#   2) 自动：push 到 master 且改动命中 paths 时自动构建（用于「改完即出包」）

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用显示名称'
        required: false
        default: '观影听涛'
      api_url:
        description: '内置订阅源URL（App内仍可随时更换；留空则用默认高天流云源）'
        required: false
        default: 'https://gh-proxy.com/https://raw.githubusercontent.com/st800820/TVBoxOSC/master/taoying/config.json'
      publish:
        description: '构建完成后发布到 Releases（取消勾选则仅产出 Artifact）'
        required: false
        type: boolean
        default: true
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/taoying.yml'
      - 'tools/**'
      - 'custom/**'

permissions:
  contents: write

concurrency:
  group: taoying-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APP_NAME: ${{ inputs.app_name || '观影听涛' }}
      API_URL: ${{ inputs.api_url || 'https://gh-proxy.com/https://raw.githubusercontent.com/st800820/TVBoxOSC/master/taoying/config.json' }}
      APP_ID: com.taoying.app
      ENABLE_DESUGAR: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 记录上游 commit，便于事后定位「这批包是基于哪个上游版本」，也可据此回退
      # 版本号规则：同一天多次构建按 v1、v2、v3 递增，外部一眼能看出迭代次序
      #   tag        taoying-261024v3
      #   versionName 1.0.0-taoying-261024v3
      #   versionCode 261024003（天×1000+序号，保证比旧的 26102409 大，可覆盖安装）
      - name: Clone upstream source
        run: |
          set -e
          # 锁定上游 commit：A/B 对比必须排除「上游自己变了」这个混淆变量。
          # 2026-11-12 上午 T0 用 ab11d28、v2 用 89ec1b7，导致无法判断差异来自
          # 我方改动还是上游。此后所有构建固定到同一个 SHA，要升级上游需显式改这里。
          UPSTREAM_PIN=89ec1b7504426b3ff5e9d0996c3bbf50c9d2eff0
          git init -q TVBoxOSC
          git -C TVBoxOSC remote add origin https://github.com/q215613905/TVBoxOS
          git -C TVBoxOSC fetch --depth 1 origin "$UPSTREAM_PIN"
          git -C TVBoxOSC checkout --detach FETCH_HEAD
          ACTUAL=$(git -C TVBoxOSC rev-parse HEAD)
          [ "$ACTUAL" = "$UPSTREAM_PIN" ] || { echo "::error::上游 SHA 锁定失败: $ACTUAL"; exit 1; }
          UPSTREAM=$(git -C TVBoxOSC rev-parse --short HEAD)
          echo "上游锁定: $UPSTREAM_PIN (不再随上游 main 漂移)"
          DAY=$(TZ=Asia/Shanghai date +%y%m%d)
          EXIST=$(git ls-remote --tags origin 2>/dev/null | sed 's#.*refs/tags/##' | grep -c "^taoying-${DAY}v" || true)
          SEQ=$((EXIST + 1))
          echo "UPSTREAM_SHA=$UPSTREAM" >> $GITHUB_ENV
          echo "tag=taoying-${DAY}v${SEQ}" >> $GITHUB_ENV
          echo "SHORT=${DAY}v${SEQ}" >> $GITHUB_ENV
          echo "BUILD_DATE=${DAY}v${SEQ}" >> $GITHUB_ENV
          echo "VERSION_CODE=$((10#$DAY * 1000 + SEQ))" >> $GITHUB_ENV
          echo "上游版本: $UPSTREAM"
          echo "本次版本: 261024 系列第 $SEQ 个 → ${DAY}v${SEQ}（code $((10#$DAY * 1000 + SEQ))）"
          echo "应用: $APP_NAME ($APP_ID)"
          echo "内置源: $API_URL"

      # 所有源码改动集中在这个脚本里，失败会中止构建并留下日志
      - name: Customize sources
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/tools/patch_sources.py" TVBoxOSC 2>&1 | tee /tmp/patch.log

      - name: Copy icons
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/custom/icons"
          DST="TVBoxOSC/app/src/main/res"
          cp -f "$SRC/drawable-hdpi/app_icon.png"    "$DST/drawable-hdpi/app_icon.png"
          cp -f "$SRC/drawable-xhdpi/app_icon.png"   "$DST/drawable-xhdpi/app_icon.png"
          cp -f "$SRC/drawable-xxhdpi/app_icon.png"  "$DST/drawable-xxhdpi/app_icon.png"
          cp -f "$SRC/drawable-xxxhdpi/app_icon.png" "$DST/drawable-xxxhdpi/app_icon.png"
          cp -f "$SRC/drawable/app_banner.png"       "$DST/drawable/app_banner.png"
          ls -l "$DST"/drawable-*/app_icon.png "$DST"/drawable/app_banner.png
          # 图标必须是真 PNG，防止上传坏文件后打进包里
          BAD=$(for p in "$DST"/drawable-*/app_icon.png; do
                  magic=$(head -c 8 "$p" | od -An -tx1 | tr -d ' \n')
                  [ "$magic" = "89504e470d0a1a0a" ] || echo "$p($magic)"
                done)
          if [ -n "$BAD" ]; then echo "::error::图标不是有效 PNG: $BAD"; exit 1; fi
          echo "图标校验通过"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 签名材料（沿用原 TVBoxOSC.jks，保证与历史版本可覆盖升级）
      - name: Setup signing
        working-directory: TVBoxOSC
        run: |
          set -e
          cp -f "$GITHUB_WORKSPACE/.github/workflows/TVBoxOSC.jks" app/TVBoxOSC.jks
          printf '\nRELEASE_STORE_FILE=./TVBoxOSC.jks\nRELEASE_KEY_ALIAS=TVBoxOSC\nRELEASE_STORE_PASSWORD=TVBoxOSC\nRELEASE_KEY_PASSWORD=TVBoxOSC\n' >> ./gradle.properties
          grep -c RELEASE_ ./gradle.properties

      # 一次构建两个包：java（双架构通用）+ java32（仅 armv7，老盒子安装/启动更快）
      - name: Build With Gradle
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleJavaRelease assembleJava32Release assembleJava64Release --stacktrace 2>&1 | tee /tmp/build.log

      - name: Verify And Collect
        working-directory: TVBoxOSC
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p apk
          UNI=""; A32=""; A64=""
          for f in $(find app/build/outputs/apk -name '*.apk' | grep -v unsigned); do
            echo "== 候选: $f"
            NC=$("$BT/aapt2" dump badging "$f" | grep 'native-code:' || true)
            echo "  $NC"
            if echo "$NC" | grep -q 'armeabi-v7a' && echo "$NC" | grep -q 'arm64-v8a'; then
              UNI="$f"
            elif echo "$NC" | grep -q 'arm64-v8a'; then
              A64="$f"
            else
              A32="$f"
            fi
          done
          [ -n "$UNI" ] || { echo "::error::未产出双架构通用包"; exit 1; }
          echo "通用包: $UNI"
          echo "armv7包: ${A32:-（无）}"
          echo "arm64包: ${A64:-（无）}"

          BAD=$("$BT/aapt2" dump badging "$UNI")
          echo "$BAD" | grep -q "package: name='com.taoying.app'" || { echo "::error::包名不正确"; exit 1; }
          echo "$BAD" | grep -Eq "(sdkVersion|minSdkVersion):'19'" || { echo "::error::minSdk 不是 19"; exit 1; }
          echo "$BAD" | grep -q "native-code: .*arm64-v8a"        || { echo "::error::通用包缺 arm64"; exit 1; }
          # v1 签名用「APK 里有没有 META-INF/*.SF」判断，比解析 apksigner 文案可靠
          unzip -l "$UNI" | grep -q "META-INF/.*\.SF" \
            || { echo "::error::缺 v1 签名，Android 4.4 无法安装"; exit 1; }
          "$BT/apksigner" verify --print-certs "$UNI" > /tmp/sig_uni.log 2>&1 \
            || { cat /tmp/sig_uni.log; echo "::error::签名校验失败"; exit 1; }
          grep -E "v1 scheme|v2 scheme|v3 scheme" /tmp/sig_uni.log || true

          cp -f "$UNI" "apk/TaoYing_${SHORT}_universal.apk"
          if [ -n "$A32" ]; then
            BAD32=$("$BT/aapt2" dump badging "$A32")
            echo "$BAD32" | grep -Eq "(sdkVersion|minSdkVersion):'19'" || { echo "::error::armv7 包 minSdk 异常"; exit 1; }
            echo "$BAD32" | grep -q "native-code: 'armeabi-v7a'" || { echo "::error::armv7 包架构异常"; exit 1; }
            unzip -l "$A32" | grep -q "META-INF/.*\.SF" \
              || { echo "::error::armv7 包缺 v1 签名"; exit 1; }
            "$BT/apksigner" verify "$A32" > /dev/null 2>&1 \
              || { echo "::error::armv7 包签名校验失败"; exit 1; }
            cp -f "$A32" "apk/TaoYing_${SHORT}_arm32.apk"
          fi
          if [ -n "$A64" ]; then
            BAD64=$("$BT/aapt2" dump badging "$A64")
            echo "$BAD64" | grep -q "native-code: 'arm64-v8a'" || { echo "::error::arm64 包架构异常"; exit 1; }
            echo "$BAD64" | grep -q "armeabi-v7a" && { echo "::error::arm64 包混入 32 位库"; exit 1; }
            unzip -l "$A64" | grep -q "META-INF/.*\.SF" \
              || { echo "::error::arm64 包缺 v1 签名"; exit 1; }
            "$BT/apksigner" verify "$A64" > /dev/null 2>&1 \
              || { echo "::error::arm64 包签名校验失败"; exit 1; }
            cp -f "$A64" "apk/TaoYing_${SHORT}_arm64.apk"
          fi

          echo "== 产物 =="
          ls -lh apk/
          echo "== 体积构成 =="
          for p in apk/*.apk; do
            echo "-- $p"
            unzip -l "$p" | grep -E "classes[0-9]*\.dex|lib/.*\.so" | awk '{printf "   %10d  %s\n", $1, $4}'
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaoYing-apk
          path: TVBoxOSC/apk/*.apk
          retention-days: 30

      - name: Release To GitHub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          body: |
            ## 涛影 TVBox 定制版（${{ env.tag }}）

            | 项 | 值 |
            |---|---|
            | 应用名 / 包名 | ${{ env.APP_NAME }} / `${{ env.APP_ID }}` |
            | 版本 | `1.0.0-taoying-${{ env.BUILD_DATE }}`（versionCode `${{ env.VERSION_CODE }}`） |
            | 上游源码 | q215613905/TVBoxOS @ `${{ env.UPSTREAM_SHA }}` |
            | 内置源 | ${{ env.API_URL }} |

            ### 三个包怎么选（按体积从小到大）
            - `*_arm64.apk`：**仅 arm64-v8a，本次新增**。64 位新盒子/新手机优先，只装一套 so，体积最小且原生性能最好（minSdk 21）
            - `*_arm32.apk`：仅 armeabi-v7a，**安卓 4.4 老机顶盒优先装这个**
            - `*_universal.apk`：arm64 + armv7 双份 so，需要兼容多种设备时才用

            ### 本版改动（2026-11-12 下午 · 事件驱动换源 + EPG 本地库）
            - **新增「明确报错立即换源」**：上游在 `STATE_ERROR` / `STATE_PLAYBACK_COMPLETED` 已确定失败后仍要等 3.5 秒才动作。现改为 200ms 防抖后立刻换下一条线路，并**跳过「先换播放器」**的试错（此前每次失败先白等一轮 4 秒）
            - **4 秒兜底超时保持不变**：仅用于「还在缓冲、结果未定」的慢源。上午已实测证伪「把超时压到 1.5s」——那会误杀慢但能播的源，本版不重蹈覆辙
            - **新增 EPG 本地库（最小可用版）**：上游 `hsEpg` 是纯内存缓存、进程重启即丢。现把成功的节目单响应按台落盘（TTL 6h、MD5 文件名、原子写、接口失败/过期读旧库），**频道列表在台名后直接显示「正在播」的节目名**。复用上游原有解析逻辑，不改 m3u 头、不加 `x-tvg-url`、不批量预取打爆公益接口
            - **锁定上游 SHA `89ec1b7`**：构建不再随上游 main 漂移，消除上午 A/B 中 `ab11d28`→`89ec1b7` 的混淆变量
            - 保留既有：IJK 秒开参数组、4MB probesize 对照、shrinkResources、arm64-only 包、EPG 异步初始化、host 播放器记忆、一个台最多换一次播放器、手机遥控台、站点自检

            ### 版本号规则
            同一天多次构建依次为 `261024v1`、`261024v2`、`261024v3`…，versionCode 为「天×1000+序号」。

            > 回退方式：装回上一个 tag 的 APK 即可（同签名可覆盖安装）。
          allowUpdates: true
          artifacts: TVBoxOSC/apk/*.apk

      # 构建失败时把日志推到 ci-logs 分支，方便无人值守排查（不影响 master）
      - name: Publish failure log
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "======= patch.log ======="; tail -n 200 /tmp/patch.log 2>/dev/null
            echo "======= build.log ======="; tail -n 400 /tmp/build.log 2>/dev/null
          } > ci-logs/last-build.log
          git config user.name "taoying-ci"
          git config user.email "ci@local"
          git add ci-logs/last-build.log
          git commit -m "ci: failure log $(date -u +%Y%m%d-%H%M%S)"
          git push origin HEAD:ci-logs --force
