name: TaoYing Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用显示名称'
        required: false
        default: '涛影'
      api_url:
        description: '内置订阅源URL（App内仍可随时更换；留空则用默认高天流云源）'
        required: false
        default: 'https://ghproxy.net/https://raw.githubusercontent.com/gaotianliuyun/gao/master/0821.json'
      publish:
        description: '构建完成后发布到 Releases（取消勾选则仅产出 Artifact）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      APP_NAME: ${{ inputs.app_name || '涛影' }}
      API_URL: ${{ inputs.api_url || 'https://ghproxy.net/https://raw.githubusercontent.com/gaotianliuyun/gao/master/0821.json' }}
      APP_ID: com.taoying.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Source Code
        run: |
          git clone --depth 1 https://github.com/q215613905/TVBoxOS TVBoxOSC
          cd TVBoxOSC
          echo "tag=taoying-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "date=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "将构建: APP_NAME=$APP_NAME  APP_ID=$APP_ID"
          echo "内置源: $API_URL"

      - name: Customize
        working-directory: TVBoxOSC
        run: |
          set -e
          # 1. 修改包名（与原版 TVBox 共存）
          sed -i "s#applicationId 'com.github.tvbox.osc.jun'#applicationId '${APP_ID}'#" app/build.gradle
          # 2. 修改应用名称（strings.xml 内用 # 分隔避免特殊字符）
          sed -i "s#<string name=\"app_name\">TVBox</string>#<string name=\"app_name\">${APP_NAME}</string>#" app/src/main/res/values/strings.xml
          # 3. 投屏提示中的名称
          sed -i "s#已安装TVBox#已安装${APP_NAME}#g" app/src/main/res/layout/dialog_cast.xml
          # 4. 内置订阅源（首次启动自动写入，用户在 App 内改源后不覆盖）
          sed -i '/Hawk.init(this).build();/a\        if (!Hawk.contains(HawkConfig.API_URL)) { Hawk.put(HawkConfig.API_URL, "'"${API_URL}"'"); }' app/src/main/java/com/github/tvbox/osc/base/App.java
          # 5. 版本号
          sed -i "s#versionName '1.0.0'#versionName '1.0.0-taoying-${{ env.date }}'#" app/build.gradle
          # 6. 替换图标（启动器图标 4 个密度 + TV 横幅）
          cp -f ${{ github.workspace }}/custom/icons/drawable-hdpi/app_icon.png    app/src/main/res/drawable-hdpi/app_icon.png
          cp -f ${{ github.workspace }}/custom/icons/drawable-xhdpi/app_icon.png   app/src/main/res/drawable-xhdpi/app_icon.png
          cp -f ${{ github.workspace }}/custom/icons/drawable-xxhdpi/app_icon.png  app/src/main/res/drawable-xxhdpi/app_icon.png
          cp -f ${{ github.workspace }}/custom/icons/drawable-xxxhdpi/app_icon.png app/src/main/res/drawable-xxxhdpi/app_icon.png
          cp -f ${{ github.workspace }}/custom/icons/drawable/app_banner.png       app/src/main/res/drawable/app_banner.png
          # 7. crosswalk maven 源防失效
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          # 8. 去掉 pyramid 里的 Windows Python 硬编码路径（配置阶段需要）
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle
          echo "" > local.properties
          # ===== 验证修改结果 =====
          echo '--- applicationId ---'; grep -n "applicationId" app/build.gradle
          echo '--- app_name ---'; grep -n 'app_name' app/src/main/res/values/strings.xml
          echo '--- builtin api ---'; grep -n 'HawkConfig.API_URL' app/src/main/java/com/github/tvbox/osc/base/App.java
          echo '--- versionName ---'; grep -n 'versionName' app/build.gradle
          echo '--- icons ---'; ls -l app/src/main/res/drawable-*/app_icon.png app/src/main/res/drawable/app_banner.png

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release Apk Sign
        working-directory: TVBoxOSC
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks' ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties

      - name: Build With Gradle
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          ./gradlew assembleJavaRelease --stacktrace

      - name: Prepare Apk
        working-directory: TVBoxOSC
        run: |
          mkdir -p apk
          APK=$(find . -path "*outputs/apk*" -name "*.apk" | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then APK=$(find . -path "*outputs/apk*" -name "*.apk" | head -1); fi
          echo "found apk: $APK"
          cp -f "$APK" "apk/TaoYing_${{ env.tag }}.apk"
          ls -lh apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaoYing-apk
          path: TVBoxOSC/apk/*.apk
          retention-days: 30

      - name: Release To GitHub
        if: ${{ inputs.publish }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          body: |
            ## 涛影 TVBox 定制版
            - 应用名称：${{ env.APP_NAME }}
            - 包名：${{ env.APP_ID }}（可与原版共存）
            - 内置订阅源：${{ env.API_URL }}
            - 基于 q215613905/TVBoxOS 最新 main 分支构建
            - 仅 java flavor（armeabi-v7a + arm64-v8a）
          allowUpdates: true
          artifacts: TVBoxOSC/apk/*.apk
